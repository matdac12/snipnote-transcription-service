# /etc/nginx/sites-available/00-default-deny
#
# Ports 80/443 on this box are open to the internet only so that
# api.snipnote.app can be served and Let's Encrypt can validate it. Every other
# service here is reached through the Cloudflare Tunnel, which connects from
# localhost. This block takes over the default_server role so that any request
# whose Host we do not explicitly serve has its connection closed with no
# response.
#
# Companion change: the tunnel-only vhosts (whatsapp-omni, omni-dashboard) must
# carry `allow 127.0.0.1; allow ::1; deny all;` and an explicit server_name, or
# a spoofed Host header would still reach them from the public internet.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
