# /etc/nginx/sites-available/snipnote-api
#
# certbot --nginx adds the listen 443 / ssl_certificate directives on first run.
# Afterwards, change its `listen 443 ssl;` to `listen <public-ip>:443 ssl;` and
# drop the `listen [::]:443` line: tailscaled already holds :443 on the Tailscale
# addresses, so nginx cannot bind the 0.0.0.0 wildcard and fails with EADDRINUSE.
#
# Ports 80/443 must be open in ufw (`ufw allow 80/tcp && ufw allow 443/tcp`).
# Because that also exposes nginx's catch-all to the internet, deploy
# 00-default-deny.conf alongside this file so unknown Host headers are dropped
# and the tunnel-only vhosts stay reachable from localhost only.
# Rate limit for POST /jobs only (GET /jobs/<id> polling is not limited). The map gives
# non-POST requests an empty key, which limit_req ignores. limit_req_zone must live in
# the http{} context: this file is included there by sites-enabled, so top level is fine.
map $request_method $snipnote_jobs_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $snipnote_jobs_post_key zone=snipnote_jobs_post:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.snipnote.app;

    # The API only receives small JSON bodies (audio goes straight to Supabase Storage).
    # This used to be 25m for the removed multipart POST /transcribe.
    client_max_body_size 64k;

    # IMMEDIATE, NO-DEPLOY MITIGATION for the unauthenticated synchronous endpoint. The
    # application now answers 410 itself; this line makes nginx do it before the request
    # ever reaches Python, so it is also safe to apply while the old code is still running:
    #   location = /transcribe { return 410; }
    location = /transcribe {
        return 410 '{"detail":"POST /transcribe has been removed. Use POST /jobs."}';
        default_type application/json;
    }

    # Legacy job creation: per-IP rate limit (60/min, bursts of 20). Same proxy settings as `/`.
    location = /jobs {
        limit_req zone=snipnote_jobs_post burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }
}
