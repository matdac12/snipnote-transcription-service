# /etc/nginx/sites-available/snipnote-api
# certbot --nginx adds the listen 443 / ssl_certificate directives on first run.
server {
    listen 80;
    listen [::]:80;
    server_name api.snipnote.app;

    # OpenAI caps transcription uploads at 25 MB; match it for the legacy
    # POST /transcribe multipart endpoint.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Synchronous transcription of a large file can take minutes.
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
